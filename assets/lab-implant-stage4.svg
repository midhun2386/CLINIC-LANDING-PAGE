<svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boneGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#d9e2ec"/>
    </linearGradient>
    <linearGradient id="gumGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#ec407a"/>
    </linearGradient>
    <linearGradient id="tiGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="crownShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Bone Base -->
  <path d="M 40 160 C 100 160, 130 190, 200 190 C 270 190, 300 160, 360 160 L 360 300 C 360 310, 350 315, 340 315 L 60 315 C 50 315, 40 310, 40 300 Z" fill="url(#boneGrad4)" stroke="#bcccdc" stroke-width="2"/>

  <!-- Gum Crest -->
  <path d="M 30 145 C 90 145, 130 160, 165 160 C 180 160, 190 172, 200 172 C 210 172, 220 160, 235 160 C 270 160, 310 145, 370 145 L 370 165 C 310 165, 270 180, 235 180 C 220 180, 210 192, 200 192 C 190 192, 180 180, 165 180 C 130 180, 90 165, 30 165 Z" fill="url(#gumGrad4)"/>

  <!-- Embedded Titanium Fixture -->
  <g transform="translate(180, 175)">
    <polygon points="12,0 28,0 36,8 36,18 28,26 12,26 4,18 4,8" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 8 28 L 32 28 L 29 105 C 29 110, 20 114, 20 114 C 20 114, 11 110, 11 105 Z" fill="url(#tiGrad4)" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="7" y1="46" x2="33" y2="46" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="8" y1="66" x2="32" y2="66" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="9" y1="86" x2="31" y2="86" stroke="#f1f5f9" stroke-width="2"/>
  </g>

  <!-- Adjacent Teeth Contours for Natural Occlusion -->
  <path d="M 70 145 C 70 80, 110 70, 135 70 C 145 70, 155 90, 158 145 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>
  <path d="M 330 145 C 330 80, 290 70, 265 70 C 255 70, 245 90, 242 145 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7"/>

  <!-- Monolithic CEREC Zirconia Crown -->
  <g transform="translate(155, 60)" filter="drop-shadow(0 8px 16px rgba(0,97,148,0.15))">
    <path d="M 12 110 C 12 70, 2 50, 5 30 C 8 10, 32 8, 45 8 C 58 8, 82 10, 85 30 C 88 50, 78 70, 78 110 Z" fill="url(#crownShine)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Natural Enamel Translucency Lines -->
    <path d="M 22 20 C 32 15, 58 15, 68 20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M 16 40 C 14 60, 20 80, 22 100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Glint Star -->
    <polygon points="65,28 67,34 73,36 67,38 65,44 63,38 57,36 63,34" fill="#38bdf8"/>
  </g>

  <!-- Badge -->
  <rect x="120" y="15" width="160" height="32" rx="16" fill="#006194" filter="drop-shadow(0 4px 8px rgba(0,97,148,0.3))"/>
  <text x="135" y="35" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">CEREC Zirconia Crown Locked</text>
</svg>