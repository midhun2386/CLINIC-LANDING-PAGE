<svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boneGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#d9e2ec"/>
    </linearGradient>
    <linearGradient id="gumGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#ec407a"/>
    </linearGradient>
    <linearGradient id="tiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Bone Base -->
  <path d="M 40 160 C 100 160, 130 190, 200 190 C 270 190, 300 160, 360 160 L 360 300 C 360 310, 350 315, 340 315 L 60 315 C 50 315, 40 310, 40 300 Z" fill="url(#boneGrad2)" stroke="#bcccdc" stroke-width="2"/>
  
  <!-- Gum Crest -->
  <path d="M 30 145 C 90 145, 130 160, 165 160 C 180 160, 190 172, 200 172 C 210 172, 220 160, 235 160 C 270 160, 310 145, 370 145 L 370 165 C 310 165, 270 180, 235 180 C 220 180, 210 192, 200 192 C 190 192, 180 180, 165 180 C 130 180, 90 165, 30 165 Z" fill="url(#gumGrad2)"/>

  <!-- 3D Guided Optical Vector Path -->
  <line x1="200" y1="10" x2="200" y2="280" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
  <line x1="170" y1="172" x2="230" y2="172" stroke="#006194" stroke-width="1.5"/>

  <!-- Titanium Swiss Fixture (Descending into Bed) -->
  <g transform="translate(180, 140)">
    <!-- Hex Head -->
    <polygon points="12,0 28,0 36,8 36,18 28,26 12,26 4,18 4,8" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <rect x="6" y="26" width="28" height="12" fill="#475569" rx="2"/>
    <text x="11" y="35" font-family="monospace" font-size="8" fill="#e2e8f0" font-weight="bold">Ti-64</text>
    
    <!-- Threaded Post Body -->
    <path d="M 8 38 L 32 38 L 29 110 C 29 116, 20 120, 20 120 C 20 120, 11 116, 11 110 Z" fill="url(#tiGrad)" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Micro Threads -->
    <line x1="6" y1="46" x2="34" y2="46" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="7" y1="56" x2="33" y2="56" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="8" y1="66" x2="32" y2="66" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="9" y1="76" x2="31" y2="76" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="10" y1="86" x2="30" y2="86" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="11" y1="96" x2="29" y2="96" stroke="#f1f5f9" stroke-width="2"/>
    <line x1="13" y1="105" x2="27" y2="105" stroke="#f1f5f9" stroke-width="2"/>
  </g>

  <!-- Guided Torque Gauge Badge -->
  <rect x="230" y="80" width="145" height="32" rx="16" fill="#006194" filter="drop-shadow(0 4px 8px rgba(0,97,148,0.3))"/>
  <circle cx="246" cy="96" r="6" fill="#38bdf8"/>
  <text x="258" y="100" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">35 N/cm Torque Lock</text>

  <rect x="35" y="80" width="135" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
  <text x="48" y="100" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#006194">3D CBCT Navigated</text>
</svg>