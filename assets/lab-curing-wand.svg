<svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blueLaser" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#006194" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#006194" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceramicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Molar Tooth Cross-Section -->
  <g transform="translate(130, 110)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.08))">
    <path d="M 20 180 C 15 120, 5 70, 10 30 C 15 10, 45 15, 70 20 C 95 15, 125 10, 130 30 C 135 70, 125 120, 120 180 Z" fill="url(#ceramicGrad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Dentin Inner Layer -->
    <path d="M 30 170 C 25 120, 20 75, 25 45 C 30 30, 55 35, 70 38 C 85 35, 110 30, 115 45 C 120 75, 115 120, 110 170 Z" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
    
    <!-- Cavity Preparation Bed (Cured Nano-Ceramic) -->
    <path d="M 45 25 C 45 55, 95 55, 95 25 Z" fill="#ffffff" stroke="#006194" stroke-width="2"/>
    <text x="52" y="44" font-family="'Plus Jakarta Sans',sans-serif" font-size="8" font-weight="bold" fill="#006194">VITABLOCS</text>
  </g>

  <!-- 470nm High-Intensity Curing Light Cone -->
  <polygon points="200,30 140,150 260,150" fill="url(#blueLaser)"/>
  
  <!-- LED Curing Wand Handpiece Tip -->
  <g transform="translate(180, 5)">
    <rect x="12" y="0" width="16" height="30" rx="3" fill="#334155"/>
    <circle cx="20" cy="30" r="8" fill="#38bdf8"/>
    <circle cx="20" cy="30" r="4" fill="#ffffff"/>
  </g>

  <!-- Badges -->
  <rect x="25" y="40" width="145" height="30" rx="15" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
  <circle cx="39" cy="55" r="5" fill="#0284c7"/>
  <text x="50" y="59" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#006194">1200mW LED WAND</text>

  <rect x="230" y="40" width="145" height="30" rx="15" fill="#006194" filter="drop-shadow(0 4px 6px rgba(0,97,148,0.2))"/>
  <text x="242" y="59" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">470nm Polymerization</text>
</svg>