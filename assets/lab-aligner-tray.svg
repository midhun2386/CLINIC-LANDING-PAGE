<svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="toothShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="trayPlastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Anatomical Lateral Incisor -->
  <g transform="translate(140, 50)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.08))">
    <!-- Root Silhouette -->
    <path d="M 40 130 C 40 180, 50 220, 60 250 C 70 220, 80 180, 80 130 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Crown -->
    <path d="M 25 130 C 20 80, 30 20, 60 20 C 90 20, 100 80, 95 130 Z" fill="url(#toothShine)" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 40 35 C 50 28, 70 28, 80 35" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- SmartForce Composite 3D Attachment -->
    <rect x="70" y="65" width="16" height="18" rx="3" fill="#006194" stroke="#ffffff" stroke-width="2"/>
    <polygon points="78,60 83,65 73,65" fill="#38bdf8"/>
    <text x="74" y="78" font-family="'Plus Jakarta Sans',sans-serif" font-size="8" font-weight="bold" fill="#ffffff">SF</text>
  </g>

  <!-- Translucent Clear Aligner Tray Overlay -->
  <g transform="translate(130, 35)" filter="drop-shadow(0 4px 12px rgba(2,132,199,0.3))" id="trayGraphic">
    <path d="M 25 155 C 10 95, 20 15, 70 15 C 120 15, 130 95, 115 155 C 105 160, 35 160, 25 155 Z" fill="url(#trayPlastic)" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M 38 30 C 50 22, 90 22, 102 30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Force Vectors -->
    <g stroke="#00c853" stroke-width="2.5" stroke-linecap="round">
      <path d="M 125 75 L 145 75 M 140 70 L 145 75 L 140 80"/>
      <path d="M 80 5 L 80 -10 M 75 -5 L 80 -10 L 85 -5"/>
    </g>
  </g>

  <!-- Badges -->
  <rect x="30" y="25" width="160" height="30" rx="15" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
  <circle cx="45" cy="40" r="5" fill="#006194"/>
  <text x="56" y="44" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#006194">SMARTFORCE VECTOR</text>

  <rect x="220" y="255" width="150" height="30" rx="15" fill="#006194" filter="drop-shadow(0 4px 6px rgba(0,97,148,0.2))"/>
  <text x="232" y="274" font-family="'Plus Jakarta Sans',sans-serif" font-size="11" font-weight="700" fill="#ffffff">SmartTrack Thermoplastic</text>
</svg>